<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under construction</title>
  <meta name="description" content="We're building something. Check back soon." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      width: 100%;
      background: #fdf8f3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-family: 'Caveat', cursive;
      font-weight: 400;
      font-size: 20px;
      color: #a89580;
      letter-spacing: 0.35em;
      text-transform: lowercase;
      margin: 0 0 12px 0;
      padding-left: 0.35em;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <h1>under construction</h1>
  <canvas id="c" width="340" height="160" aria-label="Excavator scooping glitter"></canvas>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const groundY = 130;
    const leftPileX = 55, rightPileX = 270;
    const hillHeight = 44, hillRadius = 20;
    const purples = ["#9b6bd6","#b48ee0","#c9a8ec","#8a55c9","#d7bff0"];

    const hill = [];
    for (let i = 0; i < 220; i++) {
      const u = Math.random(), v = Math.random();
      const rx = (u - 0.5) * 2 * hillRadius;
      const envelope = Math.sqrt(Math.max(0, 1 - (rx / hillRadius) ** 2));
      const ry = v * envelope * hillHeight;
      hill.push({
        x: leftPileX + rx + (Math.random() - 0.5) * 1.2,
        y: groundY - ry - Math.random() * 0.8,
        r: 1 + Math.random() * 1.2,
        a: 0.75 + Math.random() * 0.25,
        hue: Math.floor(Math.random() * purples.length)
      });
    }

    let particles = [];
    const CYCLE = 8000;
    const start = performance.now();
    const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

    const drawExcavator = (x, facingRight, armAngle, stickAngle, bucketAngle) => {
      ctx.save();
      ctx.translate(x, groundY);
      if (!facingRight) ctx.scale(-1, 1);
      ctx.strokeStyle = "#1a1a1a";
      ctx.lineWidth = 1.1;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      ctx.beginPath();
      ctx.ellipse(0, -4, 26, 5, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(-15, -4, 1.2, 0, Math.PI * 2);
      ctx.moveTo(16.2, -4);
      ctx.arc(15, -4, 1.2, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-16, -9); ctx.lineTo(14, -9);
      ctx.lineTo(14, -18); ctx.lineTo(-16, -18);
      ctx.closePath();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-14, -18); ctx.lineTo(-14, -28);
      ctx.lineTo(2, -28);   ctx.lineTo(6, -18);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-11, -25); ctx.lineTo(-2, -25);
      ctx.lineTo(0, -20);   ctx.lineTo(-11, -20);
      ctx.closePath();
      ctx.stroke();

      ctx.save();
      ctx.translate(8, -14);
      ctx.rotate(armAngle);
      const boomLen = 22;
      ctx.beginPath();
      ctx.moveTo(0, -1.5); ctx.lineTo(boomLen, -1.5);
      ctx.moveTo(0,  1.5); ctx.lineTo(boomLen,  1.5);
      ctx.stroke();

      ctx.translate(boomLen, 0);
      ctx.rotate(stickAngle);
      const stickLen = 16;
      ctx.beginPath();
      ctx.moveTo(0, -1); ctx.lineTo(stickLen, -1);
      ctx.moveTo(0,  1); ctx.lineTo(stickLen,  1);
      ctx.stroke();

      ctx.translate(stickLen, 0);
      ctx.rotate(bucketAngle);
      ctx.beginPath();
      ctx.moveTo(0, -3); ctx.lineTo(8, -1);
      ctx.lineTo(8,  5); ctx.lineTo(-1, 6);
      ctx.closePath();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, 6); ctx.lineTo(1, 8);
      ctx.moveTo(3, 6); ctx.lineTo(4, 8);
      ctx.moveTo(6, 6); ctx.lineTo(7, 8);
      ctx.stroke();

      ctx.restore();
      ctx.restore();
    };

    const drawHill = () => {
      for (const d of hill) {
        ctx.globalAlpha = d.a;
        ctx.fillStyle = purples[d.hue];
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    };

    const spawnDump = (ox, oy) => {
      for (let i = 0; i < 6; i++) {
        particles.push({
          x: ox + (Math.random() - 0.5) * 4,
          y: oy,
          vx: (Math.random() - 0.5) * 0.6,
          vy: 0.6 + Math.random() * 0.8,
          r: 1 + Math.random() * 1.5,
          hue: Math.floor(Math.random() * purples.length),
          life: 0,
          maxLife: 70 + Math.random() * 50
        });
      }
    };

    const updateParticles = () => {
      for (const p of particles) {
        p.life++;
        p.vy += 0.08;
        p.vx *= 0.99;
        p.x += p.vx;
        p.y += p.vy;
        if (p.y > groundY) { p.y = groundY; p.vy *= -0.25; p.vx *= 0.6; }
      }
      particles = particles.filter(p => p.life < p.maxLife);
    };

    const drawParticles = () => {
      for (const p of particles) {
        ctx.globalAlpha = (1 - p.life / p.maxLife) * 0.95;
        ctx.fillStyle = purples[p.hue];
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    };

    const drawGround = () => {
      ctx.strokeStyle = "#c9b8a4";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.moveTo(20, groundY + 2); ctx.lineTo(W - 20, groundY + 2);
      ctx.stroke();
      ctx.setLineDash([]);
    };

    const tick = now => {
      const elapsed = (now - start) % CYCLE;
      const t = elapsed / CYCLE;
      const scoopX = leftPileX + hillRadius + 33;
      const dumpX = rightPileX - 30;

      let x = scoopX, facingRight = false;
      let armAngle = -0.2, stickAngle = 0.4, bucketAngle = -0.3;

      if (t < 0.22) {
        const k = t / 0.22;
        x = scoopX; facingRight = false;
        armAngle = -0.1 + easeInOut(k) * 0.25;
        stickAngle = 0.5 - easeInOut(k) * 0.3;
        bucketAngle = -0.4 + easeInOut(k) * 1.6;
      } else if (t < 0.45) {
        const k = (t - 0.22) / 0.23;
        x = scoopX + easeInOut(k) * (dumpX - scoopX);
        facingRight = true;
        armAngle = -0.5; stickAngle = -0.3; bucketAngle = 1.0;
      } else if (t < 0.7) {
        const k = (t - 0.45) / 0.25;
        x = dumpX; facingRight = true;
        armAngle = -0.3 + easeInOut(k) * 0.2;
        stickAngle = -0.2 + easeInOut(k) * 0.4;
        bucketAngle = 1.0 - easeInOut(k) * 2.2;
        if (k > 0.2 && k < 0.85) {
          const jxw = dumpX + 8, jyw = groundY - 14;
          const a1 = armAngle, a2 = armAngle + stickAngle, a3 = a2 + bucketAngle;
          const ex = jxw + 22 * Math.cos(a1) + 16 * Math.cos(a2);
          const ey = jyw + 22 * Math.sin(a1) + 16 * Math.sin(a2);
          const tipX = ex + 4 * Math.cos(a3) - 7 * Math.sin(a3);
          const tipY = ey + 4 * Math.sin(a3) + 7 * Math.cos(a3);
          spawnDump(tipX, tipY);
        }
      } else if (t < 0.95) {
        const k = (t - 0.7) / 0.25;
        x = dumpX - easeInOut(k) * (dumpX - scoopX);
        facingRight = false;
        armAngle = -0.3; stickAngle = 0.2; bucketAngle = 0.0;
      } else {
        x = scoopX; facingRight = false;
      }

      ctx.clearRect(0, 0, W, H);
      drawGround();
      drawHill();
      updateParticles();
      drawParticles();
      drawExcavator(x, facingRight, armAngle, stickAngle, bucketAngle);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  </script>
</body>
</html>
